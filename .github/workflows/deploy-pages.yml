name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 验证 + 构建:静态校验 → 源码版冒烟(无头 Chrome 走完 10 步叙事,zh + en 两种语言)→
  # 构建单文件版(不入库,CI 现场生成)→ 对构建产物再冒烟 → 打包站点(首页即单文件版)。
  # 任何一步失败都不会部署;冒烟测试通过会清理截图,失败截图会作为 artifact 上传供排查。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static check (esbuild)
        run: pnpm run check

      - name: Smoke test (source, headless Chrome)
        run: pnpm run smoke

      - name: Smoke test (source, English locale)
        run: pnpm run smoke:en

      - name: Build embedded single-file version
        run: pnpm run build

      - name: Smoke test (embedded, file://)
        run: pnpm run smoke:embedded

      - name: Upload smoke failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # 线上首页直接发布单文件打包版:1 个请求、minify 后 gzip ≈330KB;
      # 源码版(81 个模块请求 + 1.3MB 未压缩 three.js)只用于本地开发,不上线。
      # index-embedded.html 原样再发一份,供「下载后双击打开」的归档用途。
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index-embedded.html _site/index.html
          cp index-embedded.html _site/index-embedded.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
